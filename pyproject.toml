[project]
name = "techne"
version = "1.0.0"
description = "An opinionated Claude Code skill collection for repo hygiene, audits, doc/code drift, and document builds."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-subprocess>=1.5",
    "ruff>=0.16.8",
    "ty>=0.0.82,<0.1",
    "zensical>=0.0.61",
    "shellcheck-py>=0.11",
    "zizmor>=1.30.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skill scripts are standalone files, not packages; conftest.py loads them by
# path and tests import it directly.
pythonpath = ["tests"]
addopts = "-q --strict-markers"

# Linted paths live in the Makefile's lint and fix targets.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
