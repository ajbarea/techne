[project]
name = "techne"
version = "0.1.0"
description = "An opinionated Claude Code skill collection for repo hygiene, audits, and doc/code drift."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-subprocess>=1.5",
    "ruff>=0.16.6",
    "zensical>=0.0.60",
    "shellcheck-py>=0.11",
    "zizmor>=1.30.1",
]

[tool.uv]
package = false

# ruff config — narrow scope today (just scripts/) since the only tracked
# Python in this repo is the SKILL.md frontmatter validator. The sister
# floor is `ruff>=0.9`, `target-version = "py312"`. Extend `select` as more
# Python lands.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Skill scripts are standalone files, not packages; conftest.py loads them by
# path and tests import it directly.
pythonpath = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
