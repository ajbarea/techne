[project]
name = "techne"
version = "1.5.0"
description = "An opinionated Claude Code skill collection for repo hygiene, audits, doc/code drift, and document builds."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-subprocess>=1.5",
    "ruff>=0.17.3",
    "ty>=0.0.95,<0.1",
    "zensical>=0.0.74",
    "shellcheck-py>=0.11",
    "zizmor>=1.31.1",
    "pytest-codspeed>=5.0.4,<5.1",
    "mutmut==3.8.1",
]
epistole = [
    "mcp>=2.3,<3",
    "google-api-python-client>=2.180",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.2",
]
heuresis = ["pyyaml>=6.0.2"]

[tool.uv]
package = false
default-groups = ["dev", "epistole", "heuresis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skill scripts are standalone files, not packages; conftest.py loads them by
# path and tests import it directly.
pythonpath = ["tests", "plugins/epistole", "plugins/heuresis", "plugins/schole"]
addopts = "-q --strict-markers -ra"

# Linted paths live in the Makefile's lint and fix targets.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "G", "LOG"]

[tool.ty.environment]
extra-paths = ["tests", "plugins/epistole", "plugins/heuresis", "plugins/schole"]

# scripts/mutation.py: each module under mutation testing and the test files that exercise it.
# The latency and bench tests time the hooks rather than check them, so they are left out.
[tool.techne.mutation]
"plugins/phylax/hooks/git_guards.py" = ["tests/test_git_guards.py"]
"plugins/phylax/hooks/git_options.py" = ["tests/test_git_guards.py"]
"plugins/phylax/hooks/git_checks.py" = [
    "tests/test_git_guards.py",
    "tests/test_secret_guard.py",
    "tests/test_body_gate.py",
]
"plugins/phylax/hooks/body_gate.py" = ["tests/test_body_gate.py"]
"plugins/phylax/hooks/secret_scan.py" = ["tests/test_secret_guard.py"]
"plugins/phylax/hooks/model_guard.py" = ["tests/test_model_guard.py"]
"plugins/phylax/hooks/email_greeting.py" = ["tests/test_email_greeting.py"]
"plugins/techne/hooks/board_add.py" = ["tests/test_board_hook.py"]
"plugins/techne/_shared/project_board.py" = ["tests/test_board_hook.py"]
