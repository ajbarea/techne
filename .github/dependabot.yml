# Source of truth: templates/dependabot.yml.example. /techne:sisters audits
# drift across the fleet. techne is single-package uv + GitHub Actions only.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # cooldown: hold new releases 7d (supply-chain); security updates bypass it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      uv:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    # Both trees: `/` resolves to .github/workflows, and the starter templates
    # are a second directory because scripts/check_action_pins.sh requires them
    # to match the live pins. A non-root path is read literally, so the
    # templates must stay plain, valid workflow YAML.
    directories:
      - "/"
      - "/.github-template/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # SHA-pinned actions get version updates (not security alerts); cooldown holds
    # a freshly-published release 7 days so a compromise can surface before the bump.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
