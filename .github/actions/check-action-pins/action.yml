name: check-action-pins
description: Fail unless every remote `uses:` ref in the caller's workflows is pinned to a full 40-character commit SHA. Run it after actions/checkout.
inputs:
  directory:
    description: Target repository directory to check (defaults to workspace root)
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Check action pins
      shell: bash
      env:
        PIN_DIR: ${{ inputs.directory }}
        PIN_REQUIRE_WORKFLOWS: "1"
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/check_action_pins.sh" "$PIN_DIR"
