name: freshness

# Weekly check of Claude Code, plugin and Agent Skills changes against techne. Two jobs, so the
# one that reads the web never holds a token that can write: `analyze` runs Claude read-only and
# returns the issue as structured output; `report` files it with no model in the loop.
# The instructions are .github/freshness.md; `make freshness` runs the same check locally.

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
    steps:
      - name: Need a Claude credential
        id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY" ] || [ -n "$OAUTH" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to run the freshness check."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        id: claude
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Keep credentials out of every subprocess Claude starts.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Follow the instructions in .github/freshness.md for the repository ${{ github.repository }}."
          claude_args: |
            --max-turns 80
            --permission-mode dontAsk
            --allowedTools 'Read,Glob,Grep,WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:code.claude.com),WebFetch(domain:agentskills.io),Bash(gh issue list:*),Bash(gh issue view:*)'
            --disallowedTools 'Write,Edit,WebSearch,Read(//proc/**),Read(./.git/**)'
            --json-schema '{"type":"object","properties":{"file":{"type":"boolean"},"title":{"type":"string"},"body":{"type":"string"},"summary":{"type":"string"}},"required":["file","summary"]}'

  report:
    needs: analyze
    if: needs.analyze.outputs.result != '' && fromJSON(needs.analyze.outputs.result).file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.analyze.outputs.result }}
        run: |
          title="$(jq -r '.title // empty' <<<"$RESULT")"
          jq -r '.body // empty' <<<"$RESULT" > body.md
          if [ -z "$title" ] || [ ! -s body.md ]; then
            echo "::error::analyze asked to file an issue but returned no title or body."
            exit 1
          fi
          gh label list --search freshness --json name --jq '.[].name' | grep -qx freshness ||
            gh label create freshness --color 0e8a16 \
              --description "Upstream Claude Code and skills changes to act on"
          gh issue create --label freshness --title "$title" --body-file body.md
