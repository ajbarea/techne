name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# ruff prints lint and format findings as annotations on the PR's changed lines. Set here
# rather than as a flag, so `make lint` stays the same command locally and in CI.
env:
  RUFF_OUTPUT_FORMAT: github

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dev dependencies
        run: make setup

      - name: Lint (ruff check + format)
        run: make lint

      - name: Shellcheck (scripts/*.sh)
        run: make shellcheck

      - name: Plugin manifest + hooks (claude plugin validate)
        run: make plugin-validate

      - name: Hooks module tests (claude plugin test)
        run: make plugin-test

      # graphe:slides checks and renders web decks in Chromium, at the Playwright pin
      # slides.py names.
      - name: Install Chromium for the web deck tests
        run: uv run --no-project --with playwright==1.63.0 playwright install --with-deps chromium

      # graphe:slides and graphe:pdf read their PDFs back with poppler (pdftotext, pdfinfo), and
      # graphe:slides compares its editable .pptx export with the browser through LibreOffice.
      # GitHub's runner docs: run apt-get update before every install.
      - name: Install poppler and LibreOffice Impress for the document tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-impress

      # phylax's block_secrets guard runs gitleaks; its tests fail rather than skip on CI.
      - name: Install gitleaks for the secret guard tests
        run: bash scripts/install_gitleaks.sh

      - name: Structural checks + pytest
        run: make test
        env:
          # No TeX Live on the runner, so graphe:latex's end-to-end cases cannot
          # build. Declaring the opt-out is what keeps them from skipping unseen:
          # without this the suite fails rather than reporting a green run that
          # tested nothing. The gate parsers themselves run here unconditionally.
          TECHNE_NO_TEX: "1"
          # graphe:pdf's renders compile through Typst, whose first run fetches
          # cmarker from Typst Universe. Declining that keeps the pipeline
          # hermetic; the markdown front end is covered here unconditionally.
          TECHNE_NO_TYPST: "1"
          # techne:theoros's lifecycle tests drive real tmux sessions. Where the runner
          # has tmux they run regardless; the declaration only permits its absence.
          TECHNE_NO_TMUX: "1"


      - name: Hook tests on the oldest supported python3
        run: make test-hooks-oldest

      - name: Build docs site (same command docs.yml deploys with)
        run: make build

      - name: GHA security (zizmor)
        run: make zizmor
        env:
          GH_TOKEN: ${{ github.token }}
