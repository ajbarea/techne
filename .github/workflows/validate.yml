name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make setup

      - name: Lint (ruff check + format)
        run: make lint

      - name: Shellcheck (scripts/*.sh)
        run: make shellcheck

      - name: Structural checks + pytest
        run: make test
        env:
          # No TeX Live on the runner, so techne:latex's end-to-end cases cannot
          # build. Declaring the opt-out is what keeps them from skipping unseen:
          # without this the suite fails rather than reporting a green run that
          # tested nothing. The gate parsers themselves run here unconditionally.
          TECHNE_NO_TEX: "1"
          # techne:pdf's renders compile through Typst, whose first run fetches
          # cmarker from Typst Universe. Declining that keeps the pipeline
          # hermetic; the markdown front end is covered here unconditionally.
          TECHNE_NO_TYPST: "1"


      - name: GHA security (zizmor)
        run: make zizmor
        env:
          GH_TOKEN: ${{ github.token }}
