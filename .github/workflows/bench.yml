name: bench

# Whole-command timing of each hook with hyperfine, compared with bench/baseline-ci.json: the run
# fails when a hook's ratio to the python3 floor grew past bench/compare.py's threshold, which
# catches a slow creep that stays under the per-PR latency budgets in validate.yml. Weekly, and
# on a pull request that changes the bench itself. bench/README.md says how to read and refresh it.

on:
  schedule:
    - cron: "41 6 * * 2" # Tuesdays 06:41 UTC
  pull_request:
    paths:
      - "bench/**"
      - "scripts/install_hyperfine.sh"
      - "scripts/check_python_pin.py"
      - "tests/test_hook_latency.py"
      - "tests/conftest.py"
      - "Makefile"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    # A pinned OS release and Python build, as in codspeed.yml (GitHub still rebuilds the
    # ubuntu-26.04 image weekly): the baseline holds ratios to the python3 floor, which a new
    # Python minor would move. compare.py refuses another Python minor outright, so an
    # unpinned runner would turn the weekly run red on its own.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PYTHON_VERSION: "3.14.10"
      UV_PYTHON_DOWNLOADS: never # use setup-python's build or fail, never a downloaded one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: ${{ steps.python.outputs.python-path }}

      - name: Install the test dependencies
        run: uv sync --locked --no-default-groups --group dev

      - name: Check the hooks run on the pinned build
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          uv run --no-sync python scripts/check_python_pin.py
          echo "image ${ImageVersion:-unknown}; $(ldd --version | head -n 1)"

      - name: Time each hook
        run: make bench BENCH_LABEL=ci BENCH_OUT=bench/results/latest.json

      - name: Compare with the baseline
        run: make bench-compare BENCH_BASELINE=bench/baseline-ci.json BENCH_OUT=bench/results/latest.json

      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-summary-${{ github.run_attempt }}
          path: bench/results/latest.json
          if-no-files-found: ignore
          retention-days: 90
