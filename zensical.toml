]

[project.theme]
name = "material"
custom_dir = "overrides"
language = "en"
font.text = "Inter"
font.code = "JetBrains Mono"
icon.logo = "material/hammer-wrench"

features = [
    "announce.dismiss",
    "content.action.copy",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "search.share",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.plugins]
# `engine` was dropped in zensical 0.0.60, which moved search into Rust and
# stopped exposing a choice. Setting it now aborts the build.
search = {}
social = {}

# llms.txt, llms-full.txt and a Markdown copy of each page, for agents. Each section entry
# repeats the page's `description:` front matter; tests/test_docs_coverage.py keeps the two equal.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """techne is a Claude Code plugin marketplace (ajbarea/techne). Plugins: techne (code-repo skills: build audits, CI review, pre-merge review, commit plans, GitHub catch-up, a cross-repo project board, cross-repo drift), graphe (documents: LaTeX, markdown to PDF, talk decks, papers), dokimasia (bibliography verification), heuresis (idea triage against prior work), phylax (opt-in git guards and session restart), epistole (Gmail across accounts), schole (Brightspace course sites, read-only), keryx (spoken replies on WSL2). Install: /plugin marketplace add ajbarea/techne, then /plugin install <plugin>@techne, then run its setup step: /<plugin>:setup for most plugins, nothing for dokimasia (it needs only uv), and keryx status for keryx. Each plugin page lists its skills, commands, setup and troubleshooting. Per-plugin setup runbooks for agents are the AGENTS.md files under plugins/ in the repository."""

[project.plugins.llmstxt.sections]
"Start" = [
  { "index.md" = "A plugin marketplace for AI coding agents, for code repos, documents, bibliographies, ideas, Gmail and course sites. Pick the plugin for your job, install it, run its setup skill." },
  { "getting-started.md" = "Install a techne plugin, run its setup skill, and run a first skill. One first-run line for each plugin." },
]
"Plugins" = [
  { "plugins/techne.md" = "techne plugin, the code-repo skills for Claude Code. Install it, run /techne:setup, then audit builds, review CI and changes, plan commits, catch up on GitHub and check docs against code." },
  { "plugins/graphe.md" = "graphe plugin, the document skills for Claude Code. Build and gate LaTeX papers, render markdown to PDF, make talk decks, scaffold a paper and review it before submission." },
  { "plugins/dokimasia.md" = "dokimasia plugin, bibliography verification for LaTeX projects. Lint a .bib offline, verify entries against arXiv and Crossref, and check every cited key rendered." },
  { "plugins/heuresis.md" = "heuresis plugin, idea triage. Capture an idea, search papers, patents, products and your own work, name the closest existing work, and file the idea as trash, later, do or merged." },
  { "plugins/phylax.md" = "phylax plugin, opt-in Claude Code hooks. Block attribution lines in commits and PRs, block staging COMMITS.md, warn on main-checkout commits, refuse subagent calls that would silently inherit the session's model, restart an idle session onto an updated Claude Code, and route work to cheaper models while usage burns too fast." },
  { "plugins/epistole.md" = "epistole plugin, Gmail across accounts for Claude Code. Search, read and draft mail in every configured account, and send a draft only after you approve it. Local MCP server with your own Google OAuth client." },
  { "plugins/schole.md" = "schole plugin, a read-only Brightspace (D2L) course-site reader for Claude Code. Reports new announcements and content, what is due, and what came due unsubmitted after one browser sign-in." },
  { "plugins/keryx.md" = "keryx plugin, a spoken gist of each Claude Code reply in a local voice. Runs on WSL2 under Windows and lives in its own repository." },
]
"Skills" = [
  { "skills/index.md" = "Every skill, grouped by what it does, with a link to its page. Each page says when to use the skill, how to run it and what it changes." },
  { "skills/audit.md" = "Run the repo's make targets in dependency order and check each command's terminal output against its logs/dev archive." },
  { "skills/auto-commit.md" = "Group pending git changes into a conventional-commit plan in COMMITS.md for review, then branch, commit, push and open a PR on approval." },
  { "skills/board.md" = "Keep one GitHub Projects board of every repo's work by stage: Idea, Issue, In PR, Merged, Live. Show it, sync it, add ideas, mark deploys Live, and file new issues and PRs automatically." },
  { "skills/catchup.md" = "Read every comment, review and state change on a GitHub repo since you last took part, and report who is blocked on whom." },
  { "skills/ci-audit.md" = "Audit the latest GitHub Actions runs on the current branch or PR for warnings, failures and noise, and fix what is fixable in the repo." },
  { "skills/deslop.md" = "Scan comments and docstrings for AI-generated filler and propose tighter rewrites." },
  { "skills/docs-site.md" = "Audit the Zensical docs site: nav, deploy workflow, CSS and JS assets, and link and anchor integrity." },
  { "skills/docsync.md" = "Check a documentation file for drift against the code: commands, paths, config keys, signatures, versions and environment variables." },
  { "skills/elenchus.md" = "Review a change adversarially before merge: reproduce the load-bearing claim, trace every consumer, and walk a bug-class rubric." },
  { "skills/logging.md" = "Check a repo's logging against techne's standard and fix what falls short, so a bug can be found from the logs alone." },
  { "skills/research-grounded.md" = "Find decisions in IMPL.md, ROADMAP.md and decision records that lack research provenance, then search the web to ground them." },
  { "skills/reslop.md" = "Rewrite docstrings and comments from the implementation, call sites and tests instead of deleting them." },
  { "skills/techne-setup.md" = "techne:setup checks what the techne code-repo skills need on this machine (git, gh and its sign-in, uv, python3, tmux, Chromium) and prints the install command for each gap." },
  { "skills/sisters.md" = "Audit the linked repos listed in ~/.claude/techne.toml for drift in CI pins, settings, branches and conventions." },
  { "skills/theoros.md" = "Drive an interactive REPL in a named tmux session while you watch read-only with tmux attach -r." },
  { "skills/latex.md" = "Build a LaTeX document and gate the result on its log, its PDF and the assignment it answers." },
  { "skills/paper.md" = "Scaffold a research paper directory in a papers-style monorepo so it compiles on day one." },
  { "skills/paper-review.md" = "Run a pre-submission novelty and reviewer pass on a draft, with every verdict grounded in prior work retrieved this run." },
  { "skills/pdf.md" = "Render markdown to print-quality PDFs with a Typst template and verify the output against the source." },
  { "skills/graphe-setup.md" = "graphe:setup checks what the graphe document skills need on this machine (uv, TeX Live, poppler, strings, Chromium, pptx tools) and prints the install command for each gap." },
  { "skills/slides.md" = "Build a talk deck and gate it before it is presented: titles, contrast, alt text, missing files and phone fit." },
  { "skills/check.md" = "Verify a LaTeX project's bibliography: lint offline, verify against arXiv and Crossref, and check every cited key rendered." },
  { "skills/idea.md" = "Capture an idea and triage it against papers, patents, products and your own work, then file it as trash, later, do or merged." },
  { "skills/heuresis-setup.md" = "heuresis:setup checks uv, git and gh, the ideas repository and repos folder, and which search API keys are set, and creates the private ideas repository when it does not exist." },
  { "skills/phylax-setup.md" = "phylax:setup shows which phylax options are on and checks what each needs: the Claude Code version for the guard mod, python3, git, and for the restart, tmux or Windows Terminal and its state folder." },
  { "skills/phylax-budget.md" = "phylax:budget pauses budget mode for opted-in interactive sessions (off, for 4 hours by default), ends the pause (on), or shows any pause and whether this session is routed by budget mode (status)." },
  { "skills/catch-me-up.md" = "epistole:catch-me-up sweeps every Gmail account for mail since the last sweep, plus the course site when schole is installed, and reports what needs a reply or a decision. Read-only." },
  { "skills/epistole-setup.md" = "epistole:setup guides creating the Google OAuth client and signing each Gmail account in, and fixes an epistole server that did not start or an account that needs login." },
  { "skills/courses.md" = "schole:courses reports a Brightspace (D2L) course site's new announcements and content, what is due in the next two weeks, and what came due without a submission. Read-only, never marks anything read." },
  { "skills/schole-setup.md" = "schole:setup installs the browser for schole and signs you in to your Brightspace (D2L) course site once, in a real browser window." },
]
"How-to" = [
  { "examples.md" = "Worked workflows that combine techne skills: cross-repo audits, pre-release doc checks, clean multi-commit PRs, observed sessions and CI noise cleanup." },
  { "troubleshooting.md" = "Common questions and fixes for techne skills and plugins, including a skill that is not recognized, a missing tool or sign-in, odd output, and sister repo configuration." },
]
"Reference" = [
  { "configuration.md" = "Configuration reference: the techne.toml schema for sister repos, phylax guard and restart options, and per-skill config." },
  { "conventions.md" = "The conventions techne skills assume: Makefile targets, the dev-runner log archive, skill-context.md sections, COMMITS.md, the docs workflow and SHA-pinned actions." },
]
"Explanation" = [
  { "architecture.md" = "How the techne skills fit together: categories, typical workflows, design philosophy, how skills are tested and how the repo stays current." },
]
"Privacy" = [
  { "epistole.md" = "epistole, the Google OAuth app the epistole Claude Code plugin signs in with: what it does, and its privacy policy (what it reads, what stays on your computer, the two Gmail scopes it requests, and how to revoke access)." },
]

