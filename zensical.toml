[project]
site_name = "techne"
site_description = "A plugin marketplace for AI coding agents: skills for code repos and for documents, bibliography checks, idea triage, Gmail and Brightspace readers, opt-in git guards, and a spoken Claude Code. Install only the plugins you use."
site_author = "AJ Barea"
site_url = "https://ajbarea.github.io/techne/"
repo_url = "https://github.com/ajbarea/techne"
repo_name = "ajbarea/techne"
copyright = "AJ Barea"

extra_css = [
  "stylesheets/variables.css",
  "stylesheets/base.css",
  "stylesheets/components/hero.css",
  "stylesheets/components/landing.css",
]
extra_javascript = ["javascripts/reveal.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Plugins" = [
      { "techne" = "plugins/techne.md" },
      { "graphe" = "plugins/graphe.md" },
      { "dokimasia" = "plugins/dokimasia.md" },
      { "heuresis" = "plugins/heuresis.md" },
      { "phylax" = "plugins/phylax.md" },
      { "epistole" = "plugins/epistole.md" },
      { "schole" = "plugins/schole.md" },
      { "keryx" = "plugins/keryx.md" },
  ]},
  { "Skills" = [
      { "Overview" = "skills/index.md" },
      { "techne" = [
        { "techne:audit" = "skills/audit.md" },
        { "techne:auto-commit" = "skills/auto-commit.md" },
        { "techne:board" = "skills/board.md" },
        { "techne:catchup" = "skills/catchup.md" },
        { "techne:ci-audit" = "skills/ci-audit.md" },
        { "techne:deslop" = "skills/deslop.md" },
        { "techne:docs-site" = "skills/docs-site.md" },
        { "techne:docsync" = "skills/docsync.md" },
        { "techne:elenchus" = "skills/elenchus.md" },
        { "techne:logging" = "skills/logging.md" },
        { "techne:research-grounded" = "skills/research-grounded.md" },
        { "techne:reslop" = "skills/reslop.md" },
        { "techne:setup" = "skills/techne-setup.md" },
        { "techne:sisters" = "skills/sisters.md" },
        { "techne:theoros" = "skills/theoros.md" },
      ]},
      { "graphe" = [
        { "graphe:latex" = "skills/latex.md" },
        { "graphe:paper" = "skills/paper.md" },
        { "graphe:paper-review" = "skills/paper-review.md" },
        { "graphe:pdf" = "skills/pdf.md" },
        { "graphe:setup" = "skills/graphe-setup.md" },
        { "graphe:slides" = "skills/slides.md" },
      ]},
      { "dokimasia" = [
        { "dokimasia:check" = "skills/check.md" },
      ]},
      { "heuresis" = [
        { "heuresis:idea" = "skills/idea.md" },
        { "heuresis:setup" = "skills/heuresis-setup.md" },
      ]},
      { "phylax" = [
        { "phylax:setup" = "skills/phylax-setup.md" },
        { "phylax:budget" = "skills/phylax-budget.md" },
      ]},
      { "epistole" = [
        { "epistole:catch-me-up" = "skills/catch-me-up.md" },
        { "epistole:setup" = "skills/epistole-setup.md" },
      ]},
      { "schole" = [
        { "schole:courses" = "skills/courses.md" },
        { "schole:setup" = "skills/schole-setup.md" },
      ]},
  ]},
  { "How-to" = [
      { "Examples" = "examples.md" },
      { "Troubleshooting" = "troubleshooting.md" },
  ]},
  { "Reference" = [
      { "Configuration" = "configuration.md" },
      { "Conventions" = "conventions.md" },
