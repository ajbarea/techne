hidden_tests = ["tests/unit/test_provenance.py"]
report = """
# provenance: untracked files with quoted names drop out of uncommitted_code_sha256

`_git_record` splits `git status --porcelain` lines on whitespace. Under `core.quotePath` an untracked path with non-ASCII or special characters arrives C-quoted (`?? "scripts/an\\303\\241lise.py"`), so `(top / path).is_file()` is False and its bytes never reach `uncommitted_code_sha256`: two runs whose untracked code differs can record the same digest. A staged rename records `old -> new` as the path.

Interface the tests use: `provenance._changed_code()` returns `(status, path)` pairs of bytes, the path's raw bytes, for every code path that differs from HEAD (statuses such as `b"M "`, `b"C "`, `b"??"`), and `_git_record` takes its paths from it rather than from `_git("status", ...)`. A rename records both its old and new path; a copy records only its new path. A path that is not UTF-8 is recorded decoded with `backslashreplace` (`scripts/bad\\xff.py`) and still digested by its bytes.
"""

