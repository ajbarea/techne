report = """
# corpus: a written grant applies to any clone

Qt's and Chromium's REST grants answered one collector's request, from its stated address and with its User-Agent. `REST_PERMITTED` ships in this public repository, though, so any clone of it would read both hosts under the study's grant.

Interface the tests use: `RestPermission` gains `written_grant: bool = False`; Qt and Chromium set it. A written-grant host is refused unless this machine lists it in the grants file, one host a line, `#` starting a comment anywhere on a line, surrounding whitespace and case ignored. `cli.grants_file()` returns its path as a `pathlib.Path`: `SPHRAGIS_GRANTS` when set, else `$XDG_CONFIG_HOME/sphragis/grants`, or `~/.config/sphragis/grants` when `XDG_CONFIG_HOME` is unset or empty. A missing file holds no grants. A file that cannot be read (a directory, not UTF-8) stops the process with a `SystemExit` whose message contains `cannot be read`, and `SPHRAGIS_GRANTS` set but empty stops it with one containing `set but empty`: never an exception a per-change handler would catch. The check runs in the HTTP transport before any connection, and `resume_when_allowed.sh`'s lookup refuses the same hosts before its probes, printing the refusal on stdout and exiting 1. No git-route host may be permitted until the git route gets the same check. A refused written-grant host's error contains `written grant to this study's collector`.
"""

