report = """
# Hand out every character's voice before any blend

On 10-21 three terminals got blends ("Aoede and Heart", "Heart and Isabella", "Heart and Emma"), so klepsydra showed letter medallions, while ten character voices sat free.

## Cause
`VoiceBook._first_free` first skips every voice that a repo heard in the last 14 days calls home, and only then reuses one. A home is only a reservation, held by repos that are not running (`voices.json` on 10-21: 5 voices held, 11 more reserved as homes, among them the test repos idleprobe, agentprobe and pingtest). With every single voice either held or reserved, a new terminal skipped straight to the blends. A repo whose home is a blend (pingtest) also returns to its blend while single voices are free.

Interface the tests use: in `VoiceBook`, a new terminal takes a free single voice that no repo calls home; failing that, a free single voice an idle repo calls home (borrowed, it never becomes that second repo's home); only then a blend. A repo whose home is a blend takes a free single voice instead, and that becomes its home. A terminal on a blend moves to a free single voice at its next line unless pinned, and one leaving a blend goes home first. Rotation order is `POOL`, then `SPECIALTY` (`af_nicole` joins rotation there, no longer pin-only), then blends; a specialty voice set in config does not lead the rotation.
"""
