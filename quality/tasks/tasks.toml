# phylax: a removed worktree makes every later git command fail

Removing the worktree a session stood in made every later git command fail with `phylax: the git guard failed ($.process.run(python3) failed to start: ENOENT ... posix_spawn 'python3')`, which reads as a PATH problem. Every git command was blocked, not only the guarded ones, and the message did not say why.

Interface the tests use: `plugins/phylax/hooks/git_guards.py` refuses a guarded `git add` or `git commit` only when the folder it will run in (the session folder, after any `cd` and `-C`, resolved as bash does) is not an existing folder. The refusal reason contains `runs in <folder>, which is not an existing folder` and `cd to an existing folder`. A `gh pr` writer is not refused for a gone folder, but its text is still checked for attribution lines. A command the enabled guards do not check runs as usual. Hook input with no `cwd` fails closed when a blocking guard is enabled: exit 2, stderr containing `names no folder`. When the only enabled guard is the main-checkout warning, a `git commit` in a gone folder exits 1 with nothing on stdout and stderr containing `not an existing folder`.
"""

