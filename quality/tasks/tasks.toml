report = """
# sisters --auto overrides a repo's core.sshCommand and GIT_SSH

`sisters --auto` (the session-start cleanup) sets `GIT_SSH_COMMAND="ssh -o BatchMode=yes"` for every git call unless `GIT_SSH_COMMAND` is already set. Two cases go wrong:

- **A repo's `core.sshCommand` is overridden.** `GIT_SSH_COMMAND` outranks `core.sshCommand`, so a repo that names its own key (`ssh -i ~/.ssh/work`) fetches and deletes remote branches with the default key. The fetch fails and that repo is skipped.
- **`GIT_SSH` is overridden** the same way.

heuresis's `sync._env` already covers all three choices (`GIT_SSH_COMMAND`, `GIT_SSH`, `core.sshCommand`) and tests each one. The sisters copy mirrored only the first.

Found while running `make test-unit` under Anthropic's sandbox-runtime (`srt`). It sets its own `GIT_SSH_COMMAND`, and `test_git_runs_with_a_timeout_and_without_prompts_under_auto` assumes the variable is unset, so the test fails in any shell that has it set.

Interface the tests use: Tests load `plugins/techne/_shared/git_env.py`, which exposes `BATCH_SSH` (an ssh command containing `BatchMode=yes`) and `batch_ssh(env, repo)`: it returns a copy of `env` with `GIT_SSH_COMMAND` set to `BATCH_SSH` unless the caller chose ssh itself (`GIT_SSH_COMMAND`, `GIT_SSH`, or the repo's `core.sshCommand`), and never changes the dict it was given. When reading `core.sshCommand` fails (git times out or cannot start), it falls back to `BATCH_SSH`.
"""

