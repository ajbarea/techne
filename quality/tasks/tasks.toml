1. A wholly ignored folder that is not vendored code (`scratch/`, or a nested `.claude/`) hides a `CLAUDE.md` a session started there loads. Check the top level of each folder the `--directory` listing reports (`CLAUDE.md`, `.claude/CLAUDE.md`, `CLAUDE.local.md`), still not below it, so node_modules stays quiet.
