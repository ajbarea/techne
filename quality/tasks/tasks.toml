Interface the tests use: A corrupt index reports `git ls-files failed in <root>: ` followed by git's own error, not "not a git repository". A nested `CLAUDE.local.md` in folder `<where>` reads `<rel> stops Claude Code reading AGENTS.md for you in a session started in <where>/ → move it to ~/.claude/CLAUDE.md, or set Project instructions to claude-md-and-agents-md`; the root one keeps its message without the `in a session started in` part. A wholly ignored folder that is itself a git repository (a clone of another project) is not checked at all.
