report = """
# heuresis: a relative --ideas path writes records into the plugin cache and reports success

Every heuresis command runs under `uv run --directory ${CLAUDE_PLUGIN_ROOT}`, so its working directory is the plugin cache. A relative `--ideas` path therefore resolves inside the plugin, not where the caller is.

**Seen 2026-10-27.** Two `scout-context` runs called `add-record --ideas ideas` from `~/ajsoftworks`. Both exited 0 and reported their records saved, but the files landed in `<plugin cache>/ideas/runs/<id>/scout-context.json`. `pool` would have run without any context records, and nothing warned. The records were found and moved by hand.

Interface the tests use: Every path argument (`init`'s ideas path, `--ideas`, `--repos-root`, `--techne-toml`) must be absolute; a relative one exits 2 the argparse way, with an error containing `must be an absolute path` (for `--ideas`, `argument --ideas: must be an absolute path`). A command on one idea (`add-record`, `search`, `pool`, `verify`, `apply`, `restate`, `override`, `decline`) whose `--ideas` root has no `ideas/<id>.md` for that idea, because the root lacks the folder or never captured the idea, returns 2 from `cli.main` with an error containing `has no ideas/`, writing nothing; `search` refuses before it queries any source.
"""

