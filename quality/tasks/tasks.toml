report = """
# redact: .jsonl files are redacted as raw text, which breaks JSON escapes

`make redact` (`scripts/redact_identities.py`) scans every file under `datasets/results/`, including gitignored inputs such as `contamination-inputs/`. `redact.redact_file` decodes JSON only for a `.json` suffix, so it treats a `.jsonl` file as raw text. On raw text the address pattern can start at the letter after a JSON backslash: `\\\\n\\\\n@decorator(` matches as `n@decorator`, and redacting it deletes the escape letter, leaving a lone backslash.

Result: `contamination-inputs/openstack-post.jsonl` line 1090 and four lines of `openstack-pre.jsonl` (1361, 1376, 1510, 1794) no longer parse. Three of the five breaks are decorators that were not addresses, so code was rewritten too.

Interface the tests use: `scripts/redact_identities.py` gains `artifacts(results)`, the sorted list of `pathlib.Path`s (each `results / <relative path>`) of the files under `results` that git does not ignore (tracked or untracked), and `make redact` scans only those: an ignored input is study data, never published. `redact.addresses_in(path)` and `redact.redact_file(path)` read a `.jsonl` file line by line as JSON: a line with no address is kept byte for byte, a redacted line is re-encoded with `identities_redacted` set as a `.json` record is, and a line that is not JSON is scanned as text. `redact_file` returns `(set(), None)` when it finds nothing.
"""

